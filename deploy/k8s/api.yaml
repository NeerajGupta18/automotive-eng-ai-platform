apiVersion: apps/v1
kind: Deployment
metadata:
  name: aeai-api
  namespace: automotive-eng-ai
  labels: {app.kubernetes.io/name: aeai-api, app.kubernetes.io/part-of: automotive-eng-ai}
spec:
  replicas: 1                      # SQLite has one writer; scale out after moving to PostgreSQL
  strategy: {type: Recreate}       # the ReadWriteOnce volume cannot be shared by two pods during a rollout
  selector:
    matchLabels: {app.kubernetes.io/name: aeai-api}
  template:
    metadata:
      labels: {app.kubernetes.io/name: aeai-api, app.kubernetes.io/part-of: automotive-eng-ai}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: automotive-eng-ai:1.0.0
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "app.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--no-server-header"]
          ports: [{name: http, containerPort: 8000}]
          envFrom:
            - configMapRef: {name: aeai-config}
            - secretRef: {name: aeai-secrets}
          readinessProbe:
            httpGet: {path: /ready, port: http}
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests: {cpu: 250m, memory: 384Mi}
            limits: {cpu: "2", memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: aeai-data}
        - name: tmp
          emptyDir: {sizeLimit: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: aeai-api
  namespace: automotive-eng-ai
  labels: {app.kubernetes.io/name: aeai-api, app.kubernetes.io/part-of: automotive-eng-ai}
spec:
  selector: {app.kubernetes.io/name: aeai-api}
  ports: [{name: http, port: 8000, targetPort: http}]
