# Only the UI is published. TLS terminates at the ingress controller (certificate in the aeai-tls secret).
# CI pipelines (scripts/release_gate.py) and MCP clients reach the API through a second, separately
# authorised host if you need them outside the cluster; AUTH_MODE=enforced protects every API call.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aeai
  namespace: automotive-eng-ai
  labels: {app.kubernetes.io/part-of: automotive-eng-ai}
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"     # Streamlit keeps a websocket open
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: "52m"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [aeai.example.com]
      secretName: aeai-tls
  rules:
    - host: aeai.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: aeai-ui, port: {number: 8501}}
