apiVersion: apps/v1
kind: Deployment
metadata:
  name: aeai-ui
  namespace: automotive-eng-ai
  labels: {app.kubernetes.io/name: aeai-ui, app.kubernetes.io/part-of: automotive-eng-ai}
spec:
  replicas: 2                      # stateless; users sign in with their own API token
  selector:
    matchLabels: {app.kubernetes.io/name: aeai-ui}
  template:
    metadata:
      labels: {app.kubernetes.io/name: aeai-ui, app.kubernetes.io/part-of: automotive-eng-ai}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: ui
          image: automotive-eng-ai:1.0.0
          imagePullPolicy: IfNotPresent
          command: ["streamlit", "run", "ui/streamlit_app.py", "--server.port", "8501", "--server.address", "0.0.0.0",
                    "--server.headless", "true", "--browser.gatherUsageStats", "false"]
          env:
            - {name: API_URL, value: "http://aeai-api:8000"}
            - {name: HOME, value: /home/app}
          ports: [{name: http, containerPort: 8501}]
          readinessProbe:
            httpGet: {path: /_stcore/health, port: http}
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet: {path: /_stcore/health, port: http}
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 768Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: home, mountPath: /home/app}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 256Mi}
        - name: home
          emptyDir: {sizeLimit: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: aeai-ui
  namespace: automotive-eng-ai
  labels: {app.kubernetes.io/name: aeai-ui, app.kubernetes.io/part-of: automotive-eng-ai}
spec:
  selector: {app.kubernetes.io/name: aeai-ui}
  ports: [{name: http, port: 8501, targetPort: http}]
