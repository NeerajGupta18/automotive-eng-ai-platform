services:
  api:
    build: .
    env_file: [.env]
    environment:
      DATA_DIR: /data
      OLLAMA_URL: http://ollama:11434
    volumes: ["./storage:/data"]
    ports: ["8000:8000"]

  ui:
    build: .
    command: streamlit run ui/streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    environment:
      API_URL: http://api:8000
    ports: ["8501:8501"]
    depends_on: [api]

  # Optional local LLM:  docker compose --profile llm up
  #   then: docker compose exec ollama ollama pull llama3.1:8b   and set LLM_BACKEND=ollama in .env
  ollama:
    image: ollama/ollama
    profiles: ["llm"]
    volumes: ["ollama:/root/.ollama"]
    ports: ["11434:11434"]

volumes:
  ollama:
